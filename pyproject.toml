[tool.poetry]
name = "whitelist_hub"
version = "0.1.0"
description = "An automated blockchain project analysis platform focused on identifying, categorizing, and explaining smart contract functionality, with a particular emphasis on whitelist mechanisms."
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
motor = "^3.3.1"
pydantic = "^2.4.2"
celery = "^5.3.4"
redis = "^5.0.1"
aiohttp = "^3.8.6"
web3 = "^6.11.1"
jsonschema = "^4.19.1"
deepdiff = "^6.7.1"
aiofiles = "^23.2.1"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"
prometheus-client = "^0.17.1"
pytest = "^7.4.2"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.0"
openai = "^1.18.0"
anthropic = "^0.18.0"
langchain = "^0.1.12"
langchain-community = "^0.0.29"
langchain-openai = "^0.0.8"
langchain-anthropic = "^0.0.1"
google-generativeai = "^0.5.0"
langchain-google-genai = "^2.1.2"
langchain-redis = "^0.2.0"
langchain-mongodb = "^0.6.0"

[tool.poetry.dev-dependencies]
black = "^23.10.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.6.1"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
disallow_incomplete_defs = true
